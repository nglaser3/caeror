name: Coverage

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Configure
        run: cmake --preset cov

      - name: Build
        run: cmake --build --preset cov --parallel

      - name: Test
        run: ctest --preset cov

      - name: Generate coverage report
        run: gcovr --cobertura build/cov/coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/cov/coverage.xml
          use_oidc: true
          fail_ci_if_error: true
